name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned, so a new ubuntu-latest image cannot break a green build overnight.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from "packageManager" in package.json,
      # so CI and laptops run the exact same pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail if package.json and pnpm-lock.yaml disagree,
      # instead of silently resolving new versions in CI.
      - run: pnpm install --frozen-lockfile

      # Second line of defense behind .githooks/pre-commit (which can be skipped
      # with --no-verify). Prints only file names, never the matching text.
      - name: No secrets in the repository
        run: |
          if git grep -lE 'sk-ant-[A-Za-z0-9_-]{20,}|(sk|rk)_(test|live)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}'; then
            echo "::error::The files above contain what looks like an API key."
            exit 1
          fi

      # Turbo's default "strict" env mode hands a task only the variables listed in
      # turbo.json, so `LLM_CLIENT=fake pnpm dev` silently ran with LLM_CLIENT unset.
      # Found by the Phase 7 fresh-clone run; this keeps it from coming back.
      - name: Dev tasks get the shell's environment
        run: test "$(pnpm exec turbo run dev --dry=json | jq -r '.envMode')" = "loose"

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
