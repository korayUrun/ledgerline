packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/engines": true
  cpu-features: false
  esbuild: true
  # Optional native speed-up for msgpackr (BullMQ). Prebuilt binaries come as
  # separate @msgpackr-extract/* packages, and msgpackr falls back to plain JS.
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  # Usage analytics that swagger-ui-dist (@nestjs/swagger) installs. Nothing needs it.
  "@scarf/scarf": false
  ssh2: false
